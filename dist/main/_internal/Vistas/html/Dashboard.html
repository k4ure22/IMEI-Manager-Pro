<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IMEI Manager Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --glass-bg: rgba(30, 41, 59, 0.7);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        body {
            background-color: var(--bg-color);
            color: #f8fafc;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        /* ----- TABLA ----- */
        .table-container {
            flex-grow: 1;
            overflow-y: auto;
            margin: 20px;
            background: var(--glass-bg);
            border-radius: 16px;
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(10px);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th {
            background-color: rgba(15, 23, 42, 0.9);
            padding: 16px;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 1px;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        td {
            padding: 14px 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            font-size: 14px;
            transition: background 0.2s;
        }

        td[contenteditable="true"]:focus {
            background-color: rgba(59, 130, 246, 0.2);
            box-shadow: inset 0 0 0 2px #3b82f6;
            border-radius: 4px;
            outline: none;
        }

        tr {
            transition: all 0.2s ease;
            position: relative;
        }

        tr:hover {
            background-color: rgba(255, 255, 255, 0.05);
        }

        .neon-indicator {
            width: 6px;
            height: 100%;
            position: absolute;
            left: 0;
            top: 0;
            transition: box-shadow 0.3s ease, background 0.3s ease;
        }

        tr.neon-verde .neon-indicator {
            background-color: #39FF14;
            box-shadow: 0 0 15px 2px #39FF14;
        }

        tr.neon-rojo .neon-indicator {
            background-color: #FF073A;
            box-shadow: 0 0 15px 2px #FF073A;
        }

        .btn-icon {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            border-radius: 8px;
            padding: 8px 10px;
            color: white;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .btn-icon:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: scale(1.05);
        }

        .btn-icon img {
            width: 16px;
            height: 16px;
            object-fit: contain;
        }

        /* ----- MENU FLOTANTE TABLA ----- */
        .dropdown-menu {
            position: absolute;
            background: rgba(15, 23, 42, 0.95);
            border: 1px solid var(--glass-border);
            border-radius: 8px;
            padding: 5px 0;
            min-width: 120px;
            z-index: 50;
            display: none;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
        }

        .dropdown-menu.active {
            display: block;
        }

        .dropdown-item {
            padding: 10px 15px;
            cursor: pointer;
            color: #f8fafc;
            font-size: 13px;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .dropdown-item:hover {
            background: rgba(255, 7, 58, 0.2);
            color: #FF073A;
        }

        .dropdown-item img {
            width: 14px;
            height: 14px;
        }

        /* ----- DOCK ----- */
        .dock-wrapper {
            padding-bottom: 20px;
            display: flex;
            justify-content: center;
            height: 100px;
            align-items: flex-end;
        }

        .mac-dock {
            display: flex;
            gap: 12px;
            padding: 10px 14px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            align-items: flex-end;
        }

        .dock-item {
            width: 50px;
            height: 50px;
            background: linear-gradient(145deg, #1e293b, #0f172a);
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            position: relative;
            transform-origin: bottom;
        }

        .dock-item img {
            width: 28px;
            height: 28px;
            object-fit: contain;
            pointer-events: none;
            transition: width 0.1s, height 0.1s;
        }

        .dock-item::before {
            content: attr(data-label);
            position: absolute;
            top: -35px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 12px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s;
            white-space: nowrap;
        }

        .dock-item:hover::before {
            opacity: 1;
        }

        /* ----- FORMULARIO MODAL ----- */
        .modal-overlay {
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(8px);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .glass-panel {
            background: rgba(30, 41, 59, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            transform: scale(0.95);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .modal-overlay.active .glass-panel {
            transform: scale(1);
        }

        .input-glass {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            outline: none;
            transition: border 0.2s;
        }

        .input-glass:focus {
            border-color: #3b82f6;
        }

        #autocomplete-list {
            background: #1e293b;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
            border-radius: 8px;
            max-height: 150px;
            overflow-y: auto;
            z-index: 100;
        }

        .autocomplete-item {
            padding: 8px 12px;
            cursor: pointer;
            transition: background 0.1s;
            font-size: 14px;
        }

        .autocomplete-item:hover {
            background: rgba(59, 130, 246, 0.5);
        }

        .btn-toggle {
            transition: all 0.2s;
            opacity: 0.5;
        }

        .btn-toggle.active-si {
            background: rgba(57, 255, 20, 0.15);
            border-color: #39FF14;
            color: #39FF14;
            opacity: 1;
            box-shadow: 0 0 10px rgba(57, 255, 20, 0.4);
        }

        .btn-toggle.active-no {
            background: rgba(255, 7, 58, 0.15);
            border-color: #FF073A;
            color: #FF073A;
            opacity: 1;
            box-shadow: 0 0 10px rgba(255, 7, 58, 0.4);
        }

        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
        }
    </style>
</head>

<body onclick="cerrarDropdowns(event)">

    <div class="flex justify-between items-center p-6 pb-0">
        <h1 class="text-3xl font-bold tracking-tight">IMEI <span class="text-blue-500">Manager</span></h1>
    </div>

    <div class="table-container relative">
        <table>
            <thead>
                <tr>
                    <th style="width: 10px;"></th>
                    <th>IMEI</th>
                    <th>Modelo</th>
                    <th>Estado</th>
                    <th>Operador</th>
                    <th>Cliente</th>
                    <th>Razón</th>
                    <th>Encargado</th>
                    <th>Pago</th>
                    <th class="text-center">Opciones</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>

        <div id="actionMenu" class="dropdown-menu">
            <div class="dropdown-item" onclick="ejecutarEliminar()">
                <img src="iconos/eliminar.png" alt="Eliminar"
                    onerror="this.src='data:image/svg+xml;utf8,<svg fill=%22white%22 viewBox=%220 0 24 24%22 xmlns=%22http://www.w3.org/2000/svg%22><path d=%22M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z%22/></svg>'">
                Eliminar Registro
            </div>
        </div>
    </div>

    <div class="dock-wrapper">
        <nav class="mac-dock">
            <div class="dock-item" data-label="Nuevo Registro" onclick="abrirModal()">
                <img src="iconos/nuevo.png" alt="Nuevo"
                    onerror="this.src='data:image/svg+xml;utf8,<svg fill=%22white%22 viewBox=%220 0 24 24%22 xmlns=%22http://www.w3.org/2000/svg%22><path d=%22M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z%22/></svg>'">
            </div>
            <div class="dock-item" data-label="Modelos">
                <img src="iconos/modelos.png" alt="Modelos"
                    onerror="this.src='data:image/svg+xml;utf8,<svg fill=%22white%22 viewBox=%220 0 24 24%22 xmlns=%22http://www.w3.org/2000/svg%22><path d=%22M17 1.01L7 1c-1.1 0-2 .9-2 2v18c0 1.1.9 2 2 2h10c1.1 0 2-.9 2-2V3c0-1.1-.9-1.99-2-1.99zM17 19H7V5h10v14z%22/></svg>'">
            </div>
            <div class="dock-item" data-label="Cargar XLSX" onclick="cargarExcel()">
                <img src="iconos/excel.png" alt="Excel"
                    onerror="this.src='data:image/svg+xml;utf8,<svg fill=%22white%22 viewBox=%220 0 24 24%22 xmlns=%22http://www.w3.org/2000/svg%22><path d=%22M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z%22/></svg>'">
            </div>
        </nav>
    </div>

    <div id="modalOverlay" class="modal-overlay fixed inset-0 z-50 flex items-center justify-center">
        <div class="glass-panel w-96 rounded-2xl p-6 relative">
            <h2 class="text-xl font-bold mb-5 border-b border-gray-600 pb-2">Nuevo Registro</h2>
            <div class="space-y-4">
                <div>
                    <label class="text-xs text-gray-400 uppercase tracking-wide">IMEI</label>
                    <input type="text" id="regImei" class="input-glass w-full p-2 rounded-lg mt-1" autocomplete="off">
                </div>
                <div class="relative">
                    <label class="text-xs text-gray-400 uppercase tracking-wide">Modelo</label>
                    <input type="text" id="regModelo" class="input-glass auto-input w-full p-2 rounded-lg mt-1"
                        data-field="modelo" autocomplete="off">
                </div>
                <div class="relative">
                    <label class="text-xs text-gray-400 uppercase tracking-wide">Cliente</label>
                    <input type="text" id="regCliente" class="input-glass auto-input w-full p-2 rounded-lg mt-1"
                        data-field="cliente" autocomplete="off">
                </div>
                <div class="relative">
                    <label class="text-xs text-gray-400 uppercase tracking-wide">Razón</label>
                    <input type="text" id="regRazon" class="input-glass auto-input w-full p-2 rounded-lg mt-1"
                        data-field="razon" autocomplete="off">
                </div>
                <div class="relative">
                    <label class="text-xs text-gray-400 uppercase tracking-wide">Encargado</label>
                    <input type="text" id="regEncargado" class="input-glass auto-input w-full p-2 rounded-lg mt-1"
                        data-field="encargado" autocomplete="off">
                </div>
                <div>
                    <label class="text-xs text-gray-400 uppercase tracking-wide block mb-1">Pago</label>
                    <div class="flex gap-3">
                        <button id="btnPagoSi"
                            class="btn-toggle flex-1 py-2 rounded-lg border border-gray-500 font-bold"
                            onclick="setPago('Sí')">SÍ</button>
                        <button id="btnPagoNo"
                            class="btn-toggle flex-1 py-2 rounded-lg border border-gray-500 font-bold active-no"
                            onclick="setPago('No')">NO</button>
                    </div>
                </div>
            </div>
            <div class="mt-8 flex justify-end gap-3">
                <button class="px-4 py-2 rounded-lg bg-gray-600 hover:bg-gray-500 transition"
                    onclick="cerrarModal()">Cancelar</button>
                <button class="px-4 py-2 rounded-lg bg-blue-600 hover:bg-blue-500 font-bold transition"
                    onclick="guardarRegistro()">Guardar</button>
            </div>
        </div>
    </div>

    <div id="autocomplete-list" class="hidden absolute w-full"></div>

    <script>
        let registros = [];
        let pagoActual = 'No';
        let imeiSeleccionadoParaEliminar = null;

        window.addEventListener('pywebviewready', async () => {
            await cargarDatos();
        });

        async function cargarDatos() {
            registros = await window.pywebview.api.obtener_registros();
            renderizarTabla();
        }

        function evaluarNeon(estado, razon) {
            if (!estado || !razon) return "";
            razon = razon.toLowerCase();
            estado = estado.toLowerCase();

            // Condición estricta: Si la razón es desbloqueo O no registro, exige estado Libre para ser verde. 
            // Para bloqueo exige que no sea Libre.
            if (razon.includes("desbloqueo") || razon.includes("no registro")) {
                return estado.includes("libre") ? "neon-verde" : "neon-rojo";
            }
            if (razon.includes("bloqueo")) {
                return !estado.includes("libre") ? "neon-verde" : "neon-rojo";
            }
            return "";
        }

        function renderizarTabla() {
            const tbody = document.getElementById("tableBody");
            tbody.innerHTML = "";
            registros.forEach((reg, index) => {
                const tr = document.createElement("tr");
                tr.className = evaluarNeon(reg.estado, reg.razon);

                // Imágenes PNG preparadas con SVGs de fallback por si no las tienes creadas aún
                tr.innerHTML = `
                    <td class="relative"><div class="neon-indicator"></div></td>
                    <td class="text-gray-400 select-all">${reg.imei}</td>
                    <td contenteditable="true" onblur="editar(${index}, 'modelo', this.innerText)">${reg.modelo}</td>
                    <td id="estado-${index}">${reg.estado}</td>
                    <td id="operador-${index}">${reg.operador}</td>
                    <td contenteditable="true" onblur="editar(${index}, 'cliente', this.innerText)">${reg.cliente}</td>
                    <td contenteditable="true" onblur="editar(${index}, 'razon', this.innerText)">${reg.razon}</td>
                    <td contenteditable="true" onblur="editar(${index}, 'encargado', this.innerText)">${reg.encargado}</td>
                    <td contenteditable="true" onblur="editar(${index}, 'pago', this.innerText)">${reg.pago}</td>
                    <td class="text-center">
                        <button class="btn-icon mr-1" onclick="forzarScraper('${reg.imei}', ${index})" title="Actualizar">
                            <img src="iconos/actualizar.png" alt="Act" onerror="this.src='data:image/svg+xml;utf8,<svg fill=%22white%22 viewBox=%220 0 24 24%22 xmlns=%22http://www.w3.org/2000/svg%22><path d=%22M12 4V1L8 5l4 4V6c3.31 0 6 2.69 6 6 0 1.01-.25 1.97-.7 2.8l1.46 1.46C19.54 15.03 20 13.57 20 12c0-4.42-3.58-8-8-8zm0 14c-3.31 0-6-2.69-6-6 0-1.01.25-1.97.7-2.8L5.24 7.74C4.46 8.97 4 10.43 4 12c0 4.42 3.58 8 8 8v3l4-4-4-4v3z%22/></svg>'">
                        </button>
                        <button class="btn-icon mr-1" onclick="window.pywebview.api.pantallazo_imei('${reg.imei}')" title="Pantallazo">
                            <img src="iconos/camara.png" alt="Cam" onerror="this.src='data:image/svg+xml;utf8,<svg fill=%22white%22 viewBox=%220 0 24 24%22 xmlns=%22http://www.w3.org/2000/svg%22><circle cx=%2212%22 cy=%2212%22 r=%223.2%22/><path d=%22M9 2L7.17 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2h-3.17L15 2H9zm3 15c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5z%22/></svg>'">
                        </button>
                        <button class="btn-icon" onclick="abrirMenuOpciones(event, '${reg.imei}')" title="Opciones">
                            <img src="iconos/menu.png" alt="Menu" onerror="this.src='data:image/svg+xml;utf8,<svg fill=%22white%22 viewBox=%220 0 24 24%22 xmlns=%22http://www.w3.org/2000/svg%22><path d=%22M12 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z%22/></svg>'">
                        </button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        async function editar(index, campo, valor) {
            const valorLimpio = valor.trim();
            const imei = registros[index].imei;
            if (registros[index][campo] === valorLimpio) return;

            registros[index][campo] = valorLimpio;
            renderizarTabla();

            const res = await window.pywebview.api.actualizar_campo(imei, campo, valorLimpio);
            if (res.status !== "success") alert("Error guardando en BD: " + res.mensaje);
        }

        // --- LÓGICA DE MENÚ FLOTANTE ---
        function abrirMenuOpciones(e, imei) {
            e.stopPropagation();
            imeiSeleccionadoParaEliminar = imei;
            const menu = document.getElementById('actionMenu');
            menu.style.left = `${e.clientX - 100}px`;
            menu.style.top = `${e.clientY + 15}px`;
            menu.classList.add('active');
        }

        function cerrarDropdowns(e) {
            document.getElementById('actionMenu').classList.remove('active');
        }

        async function ejecutarEliminar() {
            if (!imeiSeleccionadoParaEliminar) return;
            if (confirm("¿Estás seguro de que deseas eliminar este IMEI permanentemente?")) {
                const res = await window.pywebview.api.eliminar_registro(imeiSeleccionadoParaEliminar);
                if (res.status === "success") {
                    await cargarDatos();
                } else {
                    alert("Error eliminando: " + res.mensaje);
                }
            }
        }

        // --- LÓGICA MODAL ---
        function abrirModal() { document.getElementById('modalOverlay').classList.add('active'); document.getElementById('regImei').focus(); }
        function cerrarModal() { document.getElementById('modalOverlay').classList.remove('active'); document.getElementById('autocomplete-list').classList.add('hidden'); }
        function setPago(valor) {
            pagoActual = valor;
            document.getElementById('btnPagoSi').className = `btn-toggle flex-1 py-2 rounded-lg border border-gray-500 font-bold ${valor === 'Sí' ? 'active-si' : ''}`;
            document.getElementById('btnPagoNo').className = `btn-toggle flex-1 py-2 rounded-lg border border-gray-500 font-bold ${valor === 'No' ? 'active-no' : ''}`;
        }

        const autoList = document.getElementById('autocomplete-list');
        document.querySelectorAll('.auto-input').forEach(input => {
            input.addEventListener('focus', function () {
                const field = this.getAttribute('data-field');
                const rect = this.getBoundingClientRect();
                const unicos = [...new Set(registros.map(r => r[field]).filter(Boolean))];
                if (unicos.length === 0) return;

                autoList.innerHTML = '';
                unicos.forEach(val => {
                    const div = document.createElement('div');
                    div.className = 'autocomplete-item';
                    div.textContent = val;
                    div.onmousedown = () => { this.value = val; autoList.classList.add('hidden'); };
                    autoList.appendChild(div);
                });
                autoList.style.top = `${rect.bottom + window.scrollY + 4}px`;
                autoList.style.left = `${rect.left + window.scrollX}px`;
                autoList.style.width = `${rect.width}px`;
                autoList.classList.remove('hidden');
            });
            input.addEventListener('blur', () => { setTimeout(() => autoList.classList.add('hidden'), 150); });
        });

        async function guardarRegistro() {
            const imei = document.getElementById('regImei').value;
            if (!imei) return alert("El IMEI es obligatorio");

            const nuevoReg = {
                imei: imei, modelo: document.getElementById('regModelo').value,
                estado: "Consultando...", operador: "...", cliente: document.getElementById('regCliente').value,
                razon: document.getElementById('regRazon').value, encargado: document.getElementById('regEncargado').value, pago: pagoActual
            };

            const res = await window.pywebview.api.guardar_registro(nuevoReg);
            if (res.status !== "success") return alert(res.mensaje);

            registros.push(nuevoReg);
            renderizarTabla();
            cerrarModal();

            document.querySelectorAll('.input-glass').forEach(i => i.value = '');
            setPago('No');

            const index = registros.length - 1;
            forzarScraper(imei, index);
        }

        async function forzarScraper(imei, index) {
            const tdEstado = document.getElementById(`estado-${index}`);
            tdEstado.innerText = "Consultando...";

            const res = await window.pywebview.api.actualizar_imei(imei);
            if (res.status === "success") {
                registros[index].estado = res.estado;
                registros[index].operador = res.operador;
            } else {
                registros[index].estado = "Error API";
            }
            renderizarTabla();
        }

        async function cargarExcel() {
            const res = await window.pywebview.api.cargar_excel();
            if (res.status === "success") {
                alert(res.mensaje);
                await cargarDatos();
            } else if (res.status !== "cancelled") {
                alert("Error: " + res.mensaje);
            }
        }

        // --- ANIMACIÓN DOCK ---
        const icons = document.querySelectorAll('.dock-item');
        document.addEventListener('mousemove', (e) => {
            icons.forEach(icon => {
                const rect = icon.getBoundingClientRect();
                const dist = Math.hypot(e.clientX - (rect.left + rect.width / 2), e.clientY - (rect.top + rect.height / 2));
                if (dist < 150) {
                    const size = 50 + (40 * Math.pow(Math.cos((dist / 150) * (Math.PI / 2)), 2));
                    icon.style.width = `${size}px`; icon.style.height = `${size}px`;
                    const img = icon.querySelector('img');
                    if (img) { img.style.width = `${(size / 50) * 28}px`; img.style.height = `${(size / 50) * 28}px`; }
                } else {
                    icon.style.width = `50px`; icon.style.height = `50px`;
                    const img = icon.querySelector('img');
                    if (img) { img.style.width = `28px`; img.style.height = `28px`; }
                }
            });
        });
        document.addEventListener('mouseleave', () => icons.forEach(i => {
            i.style.width = '50px'; i.style.height = '50px';
            const img = i.querySelector('img'); if (img) { img.style.width = '28px'; img.style.height = '28px'; }
        }));
    </script>
</body>

</html>
