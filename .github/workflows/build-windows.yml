name: Compilar IMEI Manager Pro para Windows

on:
  workflow_dispatch: # Botón manual en pestaña Actions de GitHub
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'

jobs:
  build-windows:
    name: Build Windows Executable & Installer Setup
    runs-on: windows-latest

    steps:
      - name: 📥 Clonar repositorio
        uses: actions/checkout@v4

      - name: 🐍 Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: 🚀 Compilar ejecutable con PyInstaller
        run: |
          pyinstaller "IMEI Manager Pro-win.spec" --clean --noconfirm

      - name: 🛠️ Instalar Inno Setup
        run: |
          choco install innosetup --no-progress
          echo "C:\Program Files (x86)\Inno Setup 6" >> $env:GITHUB_PATH
          echo "C:\Program Files\Inno Setup 6" >> $env:GITHUB_PATH
          echo "C:\ProgramData\chocolatey\bin" >> $env:GITHUB_PATH

      - name: 💿 Compilar Instalador Setup (.exe)
        run: |
          New-Item -ItemType Directory -Force -Path dist_installer
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) {
              $candidates = @(
                  "C:\Program Files (x86)\Inno Setup 6\iscc.exe",
                  "C:\Program Files\Inno Setup 6\iscc.exe",
                  "C:\ProgramData\chocolatey\bin\iscc.exe"
              )
              foreach ($c in $candidates) {
                  if (Test-Path $c) { $iscc = $c; break }
              }
          }
          if (-not $iscc) {
              throw "No se encontró iscc.exe tras instalar Inno Setup"
          }
          Write-Host "Compilando installer_windows.iss con: $iscc"
          & $iscc installer_windows.iss

      - name: 📤 Subir Instalador Setup (.exe) como Artefacto
        uses: actions/upload-artifact@v4
        with:
          name: Instalador_IMEI_Manager_Pro_Windows_Setup
          path: dist_installer/*.exe
          if-no-files-found: error

      - name: 📤 Subir Carpeta Ejecutable Portable (.zip) como Artefacto
        uses: actions/upload-artifact@v4
        with:
          name: IMEI_Manager_Pro_Windows_Portable
          path: dist/IMEI Manager Pro
